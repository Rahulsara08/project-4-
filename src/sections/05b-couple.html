<section class="pgc" id="pgc" aria-labelledby="pgct">
  <i class="bg-fix" aria-hidden="true"></i>
  <i class="pc-rod" aria-hidden="true"></i>
  <!-- the stage holds still while the page scrolls past it; the runway of photos travels from right to left and a
       paper plane flies along a curve over them (js/runway.js) -->
  <div class="rw-stage" id="rwStage">
    <div class="pc-head">
      <h2 class="pc-title rv" id="pgct">Meet the Bride &amp; Groom</h2>
      <svg class="pc-orn rv" viewBox="-60 -10 120 20" aria-hidden="true"><path d="M-56 0H-16M16 0H56" stroke="#e8c97a" stroke-width="1"/><path d="M0 8Q-5 1 0-8Q5 1 0 8Z" fill="#f2c96e"/><path d="M0 8Q-11 5-13-3Q-5-2 0 8Z" fill="#e8a24a"/><path d="M0 8Q11 5 13-3Q5-2 0 8Z" fill="#e8a24a"/></svg>
    </div>
    <div class="rw-view" id="rwView">
      <div class="rw-track" id="rwTrack">
        <i class="rw-line" aria-hidden="true"></i>
        <div class="rw-plane" id="rwPlane" aria-hidden="true"><div class="rw-flip" id="rwFlip">
          <svg viewBox="0 0 120 86"><defs><linearGradient id="rwP1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f2d9a0"/></linearGradient><linearGradient id="rwP2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a441"/><stop offset="1" stop-color="#b8802a"/></linearGradient></defs>
            <path d="M2 44 118 4 46 54Z" fill="url(#rwP1)" stroke="#c9952e" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M46 54 118 4 60 82Z" fill="url(#rwP2)" stroke="#a8743a" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M46 54 52 70 60 82" fill="none" stroke="#7a1530" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M2 44 46 54" fill="none" stroke="#a8243f" stroke-width="1.1" opacity=".55"/></svg>
        </div></div>
        <figure class="rw-step"><button class="rw-photo" type="button" aria-label="View photo 1"><img src="assets/img/couple-1.webp" alt="Running hand in hand through the garden" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step"><button class="rw-photo" type="button" aria-label="View photo 2"><img src="assets/img/couple-2.webp" alt="Smiles and sunglasses at the mehndi" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step"><button class="rw-photo" type="button" aria-label="View photo 3"><img src="assets/img/couple-3.webp" alt="A kiss on the hand" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step"><button class="rw-photo" type="button" aria-label="View photo 4"><img src="assets/img/couple-4.webp" alt="A flower and a shy smile" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step"><button class="rw-photo" type="button" aria-label="View photo 5"><img src="assets/img/couple-5.webp" alt="Down on one knee" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step"><button class="rw-photo" type="button" aria-label="View photo 6"><img src="assets/img/couple-6.webp" alt="Under a shower of petals and colour" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step"><button class="rw-photo" type="button" aria-label="View photo 7"><img src="assets/img/couple-7.webp" alt="Raising a toast with friends" loading="lazy" decoding="async"></button></figure>
      </div>
    </div>
  </div>
  <!-- tap a photo: it opens large over a blurred page; tap anywhere (or Esc) to close -->
  <div class="rw-lb" id="rwLb" role="dialog" aria-modal="true" aria-label="Photo" hidden><img id="rwLbImg" alt=""></div>
</section>
