<section class="pgc" id="pgc" aria-labelledby="pgct">
  <i class="bg-fix" aria-hidden="true"></i>
  <i class="pc-rod" aria-hidden="true"></i>
  <!-- the stage holds still while the page scrolls past it; the runway of photos travels from right to left and a
       paper plane flies along a curve over them (js/runway.js) -->
  <div class="rw-stage" id="rwStage">
    <div class="pc-head">
      <h2 class="pc-title rv" id="pgct">Meet the Bride &amp; Groom</h2>
      <svg class="pc-orn rv" viewBox="-60 -10 120 20" aria-hidden="true"><path d="M-56 0H-16M16 0H56" stroke="#e8c97a" stroke-width="1"/><path d="M0 8Q-5 1 0-8Q5 1 0 8Z" fill="#f2c96e"/><path d="M0 8Q-11 5-13-3Q-5-2 0 8Z" fill="#e8a24a"/><path d="M0 8Q11 5 13-3Q5-2 0 8Z" fill="#e8a24a"/></svg>
    </div>
    <div class="rw-view" id="rwView">
      <div class="rw-track" id="rwTrack">
        <i class="rw-line" aria-hidden="true"></i>
        <div class="rw-plane" id="rwPlane" aria-hidden="true"><div class="rw-flip" id="rwFlip">
          <svg viewBox="0 0 160 100"><defs>
            <linearGradient id="rwW1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#fbf4e4"/><stop offset="1" stop-color="#eadbb8"/></linearGradient>
            <linearGradient id="rwW2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e3d1a8"/><stop offset=".55" stop-color="#f6ecd6"/><stop offset="1" stop-color="#fffdf7"/></linearGradient>
            <linearGradient id="rwK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6bd86"/><stop offset="1" stop-color="#a98446"/></linearGradient></defs>
            <path d="M157 47 64 53 50 82Z" fill="url(#rwK)"/>
            <path d="M157 47 8 9 66 50Z" fill="url(#rwW1)" stroke="#c9a463" stroke-width=".8" stroke-linejoin="round"/>
            <path d="M157 47 3 77 66 51Z" fill="url(#rwW2)" stroke="#c9a463" stroke-width=".8" stroke-linejoin="round"/>
            <path d="M157 47 66 50.5" stroke="#b8925a" stroke-width="1.1" stroke-linecap="round"/>
            <path d="M157 47 8 9" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
            <path d="M150 47.5 20 18" stroke="#d9c39a" stroke-width=".6" opacity=".7"/>
            <path d="M150 48 18 70" stroke="#cdb487" stroke-width=".6" opacity=".7"/>
          </svg>
        </div></div>
        <!-- opening quote: shown as the section arrives -->
        <div class="rw-quote q-start" id="rqStart">
          <div class="rq-in">
            <p class="rq-pre">Our love story</p>
            <p class="rq-script">began in</p>
            <img class="rq-logo" src="assets/img/jaipur-flat.webp" alt="Jaipur" width="998" height="599" decoding="async">
            <svg class="rq-orn" viewBox="-60 -10 120 20" aria-hidden="true"><path d="M-56 0H-16M16 0H56" stroke="#e8c97a" stroke-width="1"/><path d="M0 8Q-5 1 0-8Q5 1 0 8Z" fill="#f2c96e"/><path d="M0 8Q-11 5-13-3Q-5-2 0 8Z" fill="#e8a24a"/><path d="M0 8Q11 5 13-3Q5-2 0 8Z" fill="#e8a24a"/></svg>
            <p class="rq-sub">where two hearts first met</p>
          </div>
        </div>
        <figure class="rw-step rw-cap"><button class="rw-photo" type="button" aria-label="View photo at Jal Mahal"><img src="assets/img/couple-start.webp" alt="Twirling by Jal Mahal" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step up"><button class="rw-photo" type="button" aria-label="View photo 1"><img src="assets/img/couple-1.webp" alt="Running hand in hand through the garden" loading="lazy" decoding="async"></button><p class="rw-note below"><i aria-hidden="true"></i><span>Two hearts, one journey</span></p></figure>
        <figure class="rw-step down"><button class="rw-photo" type="button" aria-label="View photo 2"><img src="assets/img/couple-2.webp" alt="Smiles and sunglasses at the mehndi" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step up"><button class="rw-photo" type="button" aria-label="View photo 3"><img src="assets/img/couple-3.webp" alt="A kiss on the hand" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step down"><button class="rw-photo" type="button" aria-label="View photo 4"><img src="assets/img/couple-4.webp" alt="A flower and a shy smile" loading="lazy" decoding="async"></button><p class="rw-note above"><i aria-hidden="true"></i><span>Every moment, a memory</span></p></figure>
        <figure class="rw-step up"><button class="rw-photo" type="button" aria-label="View photo 5"><img src="assets/img/couple-5.webp" alt="Down on one knee" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step down"><button class="rw-photo" type="button" aria-label="View photo 6"><img src="assets/img/couple-6.webp" alt="Under a shower of petals and colour" loading="lazy" decoding="async"></button></figure>
        <figure class="rw-step up"><button class="rw-photo" type="button" aria-label="View photo 7"><img src="assets/img/couple-7.webp" alt="Raising a toast with friends" loading="lazy" decoding="async"></button><p class="rw-note below"><i aria-hidden="true"></i><span>Hand in hand, always</span></p></figure>
        <figure class="rw-step rw-cap"><button class="rw-photo" type="button" aria-label="View photo at Hawa Mahal"><img src="assets/img/couple-end.webp" alt="Hand in hand at Hawa Mahal" loading="lazy" decoding="async"></button></figure>
        <!-- closing quote: lotus plants grow up beside it as the runway reaches its end -->
        <div class="rw-quote q-end" id="rqEnd">
          <img class="rq-lotus l" src="assets/img/lotus-plant.webp" alt="" width="945" height="1645" loading="lazy" decoding="async" aria-hidden="true">
          <img class="rq-lotus r" src="assets/img/lotus-plant.webp" alt="" width="945" height="1645" loading="lazy" decoding="async" aria-hidden="true">
          <div class="rq-in">
            <p class="rq-pre">and our love story</p>
            <p class="rq-script">still lives on in</p>
            <img class="rq-logo" src="assets/img/jaipur-3d.webp" alt="Jaipur" width="1242" height="368" loading="lazy" decoding="async">
            <svg class="rq-orn" viewBox="-60 -10 120 20" aria-hidden="true"><path d="M-56 0H-16M16 0H56" stroke="#e8c97a" stroke-width="1"/><path d="M0 8Q-5 1 0-8Q5 1 0 8Z" fill="#f2c96e"/><path d="M0 8Q-11 5-13-3Q-5-2 0 8Z" fill="#e8a24a"/><path d="M0 8Q11 5 13-3Q5-2 0 8Z" fill="#e8a24a"/></svg>
            <p class="rq-sub">forever, together</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- tap a photo: it opens large over a blurred page; tap anywhere (or Esc) to close -->
  <div class="rw-lb" id="rwLb" role="dialog" aria-modal="true" aria-label="Photo" hidden><img id="rwLbImg" alt=""></div>
</section>
