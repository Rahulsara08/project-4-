<section class="pg7" id="pg7" aria-labelledby="p7title" data-par-bg="-0.12">
  <div class="p7-rod" aria-hidden="true"></div>
  <div class="p7-br l" aria-hidden="true"><i class="bt"></i><i class="bs"></i><i class="bb"></i></div>
  <div class="p7-br r" aria-hidden="true"><i class="bt"></i><i class="bs"></i><i class="bb"></i></div>
  <div class="p7-fill" aria-hidden="true" data-par-bg="-0.1"></div>
  <div class="p7-hall">
    <div class="p7-head" data-par="-0.06">
      <img class="p7-hl l m-only" src="assets/img/lantern-hang.webp" alt="" width="361" height="935" loading="lazy" decoding="async" aria-hidden="true"><img class="p7-hl r m-only" src="assets/img/lantern-hang.webp" alt="" width="361" height="935" loading="lazy" decoding="async" aria-hidden="true">
      <p class="p7-hi rv" lang="hi">शुभकामनाएँ</p>
      <h2 class="p7-title rv" id="p7title">Wishing Wall</h2>
      <p class="p7-sub rv">Leave your blessings for Shubh &amp; Ayushi</p>
    </div>
    <div class="p7-arch">
      <div class="p7-frame" aria-hidden="true"><i class="at"></i></div>
      <img class="p7-lamp" src="assets/img/lantern-hang.webp" alt="" width="361" height="935" loading="lazy" decoding="async" aria-hidden="true">
      <div class="p7-in">

        <div class="wl rv" role="region" aria-roledescription="carousel" aria-label="Wishes from family and friends">
          <button class="wl-nav prev" type="button" aria-label="Previous wish"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <div class="wl-track" id="wlTrack" tabindex="0" aria-live="polite"></div>
          <button class="wl-nav next" type="button" aria-label="Next wish"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>

        <form class="wf rv" id="wishForm" autocomplete="on" novalidate>
          <p class="wf-h">Write your wish</p>
          <label class="wf-f"><span>Your name</span><input id="wfName" name="name" type="text" maxlength="40" autocomplete="name" placeholder="e.g. Rahul Sharma" required></label>
          <label class="wf-f"><span>Your wish</span><textarea id="wfWish" name="wish" rows="2" placeholder="Write a blessing for the couple…" required></textarea></label>
          <button class="wf-btn" type="submit" aria-label="Send your wish"><svg viewBox="0 0 100 92" aria-hidden="true"><defs><linearGradient id="wfHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf3554"/><stop offset=".6" stop-color="#931c39"/><stop offset="1" stop-color="#5a0f20"/></linearGradient></defs><path d="M50 88C20 66 3 50 3 28 3 13 15 3 28 3c10 0 17 5 22 13C55 8 62 3 72 3c13 0 25 10 25 25 0 22-17 38-47 60z" fill="url(#wfHeart)" stroke="#f2c96e" stroke-width="3"/><path d="M22 14c-6 2-10 8-10 14" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="4" stroke-linecap="round"/></svg><span>Send</span></button>
          <p class="wf-msg" id="wfMsg" role="status"></p>
        </form>
      </div>
    </div>
  </div>
  <div class="p7-tw l" aria-hidden="true"><i class="tc"></i><i class="ts"></i></div>
  <div class="p7-tw r" aria-hidden="true"><i class="tc"></i><i class="ts"></i></div>
  <div class="p7-base" aria-hidden="true">
    <img class="p7-palace" src="assets/img/palace-gateway.webp" alt="" width="1578" height="530" loading="lazy" decoding="async">
  </div>
</section>
