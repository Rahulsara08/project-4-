<div class="op" id="op" aria-label="Wedding invitation, tap to open">
  <!-- 2. the stage: a gold arch with page 1 of the invitation inside it; the camera then moves into the arch -->
  <div class="op-stage" id="opStage" aria-hidden="true">
    <canvas class="op-velvet" id="opVelvet"></canvas>
    <img class="op-pil l" src="assets/img/rsvp-pillar.webp" alt="" width="555" height="1937">
    <img class="op-pil r" src="assets/img/rsvp-pillar.webp" alt="" width="555" height="1937">
    <div class="op-floor"></div>
    <div class="op-arch" id="opArch">
      <div class="op-win" id="opWin"></div>
      <i class="oa-t"></i><i class="oa-m"></i><i class="oa-b"></i>
      <div class="op-chand" id="opChand"></div>
    </div>
    <img class="op-urn l" src="assets/img/flower-urn.webp" alt="" width="760" height="927">
    <img class="op-urn r" src="assets/img/flower-urn.webp" alt="" width="760" height="927">
    <img class="op-lotus-c" src="assets/img/lotus-ornament.webp" alt="" width="900" height="620">
    <i class="op-dim" id="opDim"></i>
  </div>

  <!-- 1. the front curtains: a gold rod with garlands and lanterns, the guest's name and "Tap to Open" -->
  <div class="op-front" id="opFront">
    <canvas class="op-curtain" id="opCurtain" aria-hidden="true"></canvas>
    <div class="op-hang" id="opHang" aria-hidden="true">
      <img class="op-gar l" src="assets/img/garland-left.webp" alt="" width="252" height="1222">
      <img class="op-gar r" src="assets/img/garland-right.webp" alt="" width="252" height="1222">
      <div class="op-lamp l"><i></i><img src="assets/img/lantern.webp" alt="" width="1025" height="1051"></div>
      <div class="op-lamp r"><i></i><img src="assets/img/lantern.webp" alt="" width="1025" height="1051"></div>
      <i class="op-rod"></i>
    </div>
    <img class="op-corner l" src="assets/img/lotus-ornament.webp" alt="" width="900" height="620" aria-hidden="true">
    <img class="op-corner r" src="assets/img/lotus-ornament.webp" alt="" width="900" height="620" aria-hidden="true">
    <div class="op-card" id="opCard">
      <svg class="op-orn" viewBox="-70 -10 140 20" aria-hidden="true"><path d="M-66 2C-48 2-40-6-26-3-18-1-16 4-9 3-4 2-3-3 0-6 3-3 4 2 9 3 16 4 18-1 26-3 40-6 48 2 66 2" fill="none" stroke="#d9b56a" stroke-width="1.2"/><path d="M0-9 3-5 0-1-3-5Z" fill="#e8c97a"/><circle cx="-26" cy="-3" r="1.4" fill="#e8c97a"/><circle cx="26" cy="-3" r="1.4" fill="#e8c97a"/></svg>
      <p class="op-dear">Dear</p>
      <p class="op-name"><span class="guest-name">Family &amp; Friends</span></p>
      <p class="op-inv">you are cordially invited</p>
      <button class="op-tap" id="opTap" type="button">Tap to Open</button>
    </div>
  </div>
  <i class="op-black" id="opBlack"></i>
</div>
